<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clicker Generator</title>
<link rel="stylesheet" href="style.css" />

<!--
  Everything here runs client-side, in your browser -- no server, no build
  step. The two heavy libraries (Three.js for the 3D viewport, Manifold for
  the actual CAD geometry) are loaded from jsDelivr's CDN via this import
  map, so opening index.html requires an internet connection the first
  time (browsers cache the files after that).
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/",
    "manifold-3d": "https://cdn.jsdelivr.net/npm/manifold-3d@3.5.1/manifold.js"
  }
}
</script>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>

    <div id="panel">
      <h1>Clicker Generator</h1>
      <p class="status" id="status">Loading geometry engine&hellip;</p>
      <p class="clearance" id="clearanceReadout"></p>

      <div class="row">
        <label><input type="checkbox" id="assembledToggle" checked> Show assembled</label>
      </div>

      <div class="row">
        <label for="shapeSelect" class="select-label">Outline shape</label>
        <select id="shapeSelect">
          <option value="circle">Circle</option>
          <option value="square">Square</option>
          <option value="triangle">Triangle</option>
        </select>
      </div>

      <details open>
        <summary>Overall size</summary>
        <div id="group-overall"></div>
      </details>

      <details>
        <summary>Switch socket</summary>
        <div class="row">
          <button id="stockMxBtn" class="secondary-btn">Use stock Cherry MX dimensions</button>
        </div>
        <div class="row">
          <label><input type="checkbox" id="legNotchesToggle" checked> Include switch leg relief notches (reference-matched)</label>
        </div>
        <div id="group-switch"></div>
      </details>

      <details>
        <summary>Fit &amp; skirt</summary>
        <div id="group-fit"></div>
      </details>

      <details>
        <summary>Top cap / plunger</summary>
        <div id="group-top"></div>
      </details>

      <div class="row buttons">
        <button id="resetBtn">Reset to reference defaults</button>
      </div>
      <div class="row buttons">
        <button id="exportBottomBtn">Download bottom.stl</button>
        <button id="exportTopBtn">Download top.stl</button>
      </div>

      <p class="hint">
        Defaults are measured directly from clickerTOP.stl / clickerBOTTOM.stl.
        Drag any slider to see the effect live. "Fit clearance" is the one
        value you'll likely need to tune per printer.
      </p>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
