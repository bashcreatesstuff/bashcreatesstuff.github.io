.de{padding-left:16px}
.d1{font-size:30px;color:#d6d6d6}
.d2{display:inline-block;white-space:nowrap;font-size:52px;font-weight:500;line-height:1.08;transform-origin:0 50%}
.gbar{position:absolute;left:452px;top:14px;width:62px;height:262px;background:#7cc242}
.stat{position:absolute;left:552px;top:12px;font-size:46px;font-weight:500;white-space:nowrap}

.foot{position:absolute;left:36px;bottom:10px;font-size:19px;font-weight:500}
.foot.r{left:auto;right:36px}

/* station number badges and transfer marks */
.jy{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;background:#fff;color:#1b1e24;border:solid #7cc242;border-radius:12%;font-weight:600;line-height:.9;flex:none}
.jy i{font-style:normal;font-size:.74em;font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif}  /* Noto Sans drops its J below the baseline; this J sits level with the Y */

.mk.c{border-radius:50%;border:3px solid;background:#fff;color:#1b1e24}
.mk.s{border-radius:4px;color:#fff;padding:0 3px}
.mk.o{border-radius:3px;border:3px solid;background:#fff;padding:0 3px}

/* loop map */
.lj{position:absolute;display:flex;flex-direction:row-reverse;align-items:stretch;gap:3px;transform:translateX(-50%);line-height:1.04}
.vc{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.vc span{display:block;height:1.06em;line-height:1.06em}

.le.b{text-align:right}

.le.big,.lj.big{font-weight:700}

.al.r{transform:translate(-100%,-50%)}
.al > span:last-child{display:inline-block;white-space:nowrap;transform-origin:0 50%}

.dic.open .l{animation:dOL 3s 2.2s both}   /* doors wait ~2 s, then slide open */
.dic.open .r{animation:dOR 3s 2.2s both}
@keyframes dOL{0%{transform:translateX(0);animation-timing-function:cubic-bezier(.45,0,.2,1)}80%{transform:translateX(-86px);animation-timing-function:ease-in-out}90%{transform:translateX(-79px)}100%{transform:translateX(-82px)}}

function xferHTML(s){
  let h = '<div class="sub"><span class="jp">のりかえ案内</span><span>Transfer</span></div>';
  const list = s.t.slice(0,9), rows = Math.ceil(list.length / 3), top0 = 120 + (3 - rows) * 70;
  list.forEach((k,i) => {
    h += `<div class="xi" style="left:${150 + (i % 3) * 470}px;top:${top0 + Math.floor(i / 3) * 155}px">${mark(k,60)}<div><b class="jp">${XF[k][3]}</b><span>${XF[k][4]}</span></div></div>`;
  });
  return h;
}

// ---------- train information ----------
function infoHTML(it,page){
  let h = '<div class="sub"><span class="jp">運行情報</span><span>Train Information</span></div>';
  if (page === 0) h += `<div class="ij jp">${it.j}</div>`;
  else h += `<table class="it">${[['Line',it.line],['Direction',it.dir],['Status',it.status],['Cause',it.cause]].filter(r => r[1]).map(r => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>`;
  return h + `<div class="ipg">${page + 1}/2</div>`;
}

// ---------- panels (one per monitor / car) ----------
const stage = document.getElementById('stage');
const base = Math.max(1, parseInt(q.get('car')) || 1);
// Which car each screen is. With several screens: the far-left one is the front car (1), the far-right
// one the last car (11), and any in between are random cars from the middle, in order.
// ?car=N numbers screens in a row from N instead; ?carset=1,6,11 and ?seat=K are used by the .scr,
// which works this out once across all monitors and hands each window its share.
function carList(N){
  const set = (q.get('carset') || '').split(',').map(x => parseInt(x)).filter(x => x >= 1 && x <= CARS);
  if (set.length) return [...Array(N)].map((_,i) => set[i % set.length]);
  if (q.get('car')) return [...Array(N)].map((_,i) => ((base - 1 + i) % CARS) + 1);
  if (N === 1) return [1];
  const pool = [...Array(CARS - 2)].map((_,i) => i + 2), mid = [];
  while (mid.length < N - 2 && pool.length) mid.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return [1, ...mid.sort((a,b) => a - b), CARS];
}
const SEAT = q.get('seat') ? parseInt(q.get('seat')) || 0 : q.get('car') ? base - 1 : 0;   // keeps screens' rotations offset from each other
let panels = [];
function build(){
  const N = parseInt(q.get('cars')) || Math.max(1, Math.min(6, Math.round((innerWidth / innerHeight) / (16 / 9))));
  if (panels.length === N) return;
  stage.innerHTML = ''; panels = [];
  const cars = carList(N);
  for (let i = 0; i < N; i++){
    const el = document.createElement('div'); el.className = 'car';
    el.innerHTML = `<div class="lcd"><div class="hd"><div class="dest"></div><div class="gbar"></div><div class="stat"></div><div class="c3"></div><div class="jyh"></div><div class="nm"></div><div class="clock"></div><div class="carn"></div></div><div class="bd"></div></div>`;
    stage.appendChild(el);
    const g = c => el.querySelector(c), idx = SEAT + i;
    panels.push({el, lcd:g('.lcd'), dest:g('.dest'), stat:g('.stat'), c3:g('.c3'), jyh:g('.jyh'), nm:g('.nm'), clock:g('.clock'), carn:g('.carn'), bd:g('.bd'), i:idx, car:cars[i], dx:0, dy:0});
  }
  layout();
}
function layout(){
  panels.forEach(P => {
    const r = P.el.getBoundingClientRect(), s = Math.min(r.width / 1600, r.height / 900);
    // whole device pixels only, so text never goes soft while it drifts
    const px = v => Math.round(v * devicePixelRatio) / devicePixelRatio;
    P.lcd.style.transform = `translate(${px((r.width - 1600 * s) / 2 + P.dx)}px,${px((r.height - 900 * s) / 2 + P.dy)}px) scale(${s})`;
  });
}

function update(P,st,now){
  const lp = Math.floor(now / 4000) % 3;      // 0 kanji, 1 kana, 2 English (every 4 s)
  const tIdx = st.phase === 'now' ? st.from : st.to, tgt = S[tIdx];

  // destination block: the next two big stations ahead (方面)
  const hubs = []; let c = st.phase === 'now' ? wrap(st.from + st.dir) : st.to;
  for (let g = 0; hubs.length < 2 && g < n; g++){ if (HUBS.includes(c)) hubs.push(S[c]); c = wrap(c + st.dir); }
  const dh = lp < 2
    ? `<div class="dj jp"><div><span class="dk">${hubs[0].k}・${hubs[1].k}</span></div><div class="ds">方面</div></div>`
    : `<div class="de"><div class="d1">Bound for</div><div><span class="d2">${hubs[0].e} &amp;</span></div><div><span class="d2">${hubs[1].e}</span></div></div>`;
  if (set(P.dest, dh)) P.dest.querySelectorAll('.dk,.d2').forEach(e => fit(e, 380));

  const stat = {next:['次は','つぎは','Next'], soon:['まもなく','まもなく','Arriving at'], now:['ただいま','ただいま','Now stopping at']}[st.phase][lp];
  set(P.stat, lp < 2 ? `<span class="jp">${stat}</span>` : stat);
  const c3 = CODE3[tIdx] || '';
  set(P.c3, c3); P.jyh.classList.toggle('noc', !c3);
  set(P.jyh, jyb(tgt.num, 132));
  const nm = lp === 0 ? `<span class="k jp">${spaced(tgt.k)}</span>` : lp === 1 ? `<span class="h jp">${tgt.h}</span>` : `<span class="e">${tgt.e}</span>`;
  if (set(P.nm, nm)) fit(P.nm.firstElementChild, 790);

  const d = new Date();
  const hh = d.getHours(), mm = pad(d.getMinutes());
  if (!CLOCK12) set(P.clock, hh + ':' + mm);
  else if (lp < 2) set(P.clock, `<span class="ap jp">${hh < 12 ? '午前' : '午後'}</span>${hh % 12 || 12}:${mm}`);
  else set(P.clock, `${hh % 12 || 12}:${mm}<span class="ap">${hh < 12 ? 'AM' : 'PM'}</span>`);
  set(P.carn, lp === 2 ? `<span class="cl">Car No.</span><div class="cn">${P.car}</div>` : `<div class="cn">${P.car}</div><div class="gs jp">号車</div>`);

  // which body screen this car shows right now.
  // Each phase has a pool of screen types; cars are offset by one in the pool, so with
  // up to (pool size) cars no two show the same type at once. Arc/loop alternate
  // Japanese and English each time round the pool. Changes every 8 s, on a header beat.
  let types;
  if (st.phase === 'next') types = ['arc','loop','info'];
  else if (st.phase === 'soon') types = tgt.t.length ? ['plat','xfer','arc'] : ['plat','arc','loop'];
  else types = tgt.t.length ? ['arc','loop','xfer','info'] : ['arc','loop','info'];
  const k = Math.floor(now / 8000) + P.i, m = types.length;
  let scr = q.get('screen');
  if (!scr){ scr = types[k % m]; if ((scr === 'arc' || scr === 'loop') && Math.floor(k / m) % 2) scr += 'E'; }
  const other = ((tIdx * 7 + (st.dir > 0 ? 3 : 0)) % 3) === 0;
  const infoIdx = Math.floor(now / 64000), page = Math.floor(now / 4000) % 2;

  let key = `${scr}|${st.from}|${st.to}|${st.dir}|${st.phase}`;
  if (scr.startsWith('arc') || scr.startsWith('loop')) key += '|' + mins(st.eta[1]);
  if (scr === 'info') key += `|${infoIdx}|${page}`;
  if (P.key !== key){
    P.key = key;
    P.bd.innerHTML =
      scr === 'arc' ? arcHTML(st,false) : scr === 'arcE' ? arcHTML(st,true) :
      scr === 'loop' ? loopHTML(st,false) : scr === 'loopE' ? loopHTML(st,true) :
      scr === 'plat' ? platHTML(st, P.car, tIdx, other) :
      scr === 'xfer' ? xferHTML(tgt) : infoHTML(infoFor(infoIdx), page);
    P.lm = P.bd.querySelector('.lm');
    P.am = P.bd.querySelector('.am');
    P.ag = P.bd.querySelector('.ag');
    P.agd = P.bd.querySelector('.agd');
    if (P.am) P.arc = {pts:ARC.en, moving:st.phase !== 'now'};
    P.bd.querySelectorAll('.pg b, .pg span').forEach(e => fit(e, e.parentNode.offsetWidth - 16));
    P.bd.querySelectorAll('.xi b').forEach(e => fit(e, 370));
    // long station names on the arc get squeezed to fit before the screen edge
    P.bd.querySelectorAll('.al').forEach(a => {
      const name = a.lastElementChild, gap = parseFloat(a.style.fontSize) * .22;
      fit(name, 1570 - parseFloat(a.style.left) - a.firstElementChild.offsetWidth - gap);
    });
  }
  if (P.lm){ const m = loopMarker(st); P.lm.setAttribute('transform', `translate(${m.x} ${m.y}) rotate(${m.a})`); }
}

// the red arrow on the arc glides toward the next station, over and over, while moving
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
function animate(){
  const now = performance.now();
  panels.forEach(P => {
    if (!P.am || !P.am.isConnected) return;
    const A = P.arc, f0 = ARC_F[0], f1 = ARC_F[1];
    let f = f0, op = 1;
    if (A.moving){
      const u = (now % 2600) / 2600;
      f = f0 + (f1 - f0) * .32 * ease(Math.min(1, u / .7));
      op = u < .86 ? 1 : Math.max(0, 1 - (u - .86) / .14);
    }
    const p = arcAt(A.pts, f), sc = 1 - .55 * f + .12;
    P.am.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${p.ang}) scale(${sc})`);
    P.am.style.opacity = op;
    if (P.ag){
      // as on the real screen (moving or stopped): green sweeps from the train's station to the far end,
      // holds there fully green, then starts again
      const v = (now % 4200) / 4200, fe = f0 + (ARC_END - f0) * ease(Math.min(1, v / .45));
      const full = v >= .45;
      const f1s = full ? 1 : fe;
      P.ag.setAttribute('points', f1s > f0 + .001 ? band(A.pts, f0 - .002, f1s) : '');
      if (P.agd) P.agd.setAttribute('points', f1s > f0 + .001 ? band(A.pts, f0 - .002, f1s, ARC_DROP) : '');
    }
  });
  requestAnimationFrame(animate);
}

function tick(){ const now = Date.now(), st = getState(now); panels.forEach(P => update(P, st, now)); }

// burn-in guard for OLED screens: each screen wanders up to 4 px on a slow loop (7 and 10 minute cycles),
// moving one pixel at a time every 15 s or so, far too slowly to see
function drift(){
  const t = Date.now() / 1000;
  panels.forEach((P,i) => {
    const dx = 4 * Math.sin(2 * Math.PI * t / 431 + i * 1.7), dy = 4 * Math.sin(2 * Math.PI * t / 617 + i * 2.3);
    if (Math.round(dx) !== P.dx || Math.round(dy) !== P.dy){ P.dx = Math.round(dx); P.dy = Math.round(dy); P.moved = true; }
  });
  if (panels.some(P => P.moved)){ panels.forEach(P => P.moved = false); layout(); }
}
setInterval(drift, 1000);
addEventListener('resize', () => { build(); layout(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => panels.forEach(P => { P.dest._h = P.nm._h = null; P.key = null; }));

build();
tick();
setInterval(tick, 100);
requestAnimationFrame(animate);
</script>
</body>
</html>
